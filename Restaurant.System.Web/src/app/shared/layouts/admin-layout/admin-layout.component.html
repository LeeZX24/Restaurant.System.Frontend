<div class="flex h-screen w-screen flex-col">
  <rs-header-control (toggle)="toggle()"></rs-header-control>

  <div class="flex flex-1 min-h-0">
    <!-- Main Content Area -->
    <rs-nav-menu-control [isExpanded]="isExpanded()" (toggle)="toggle()"></rs-nav-menu-control>

    @if (isExpanded()) {
      <div
        class="menu-backdrop"
        (click)="isExpanded.set(!isExpanded())"
        (keyup.enter)="isExpanded.set(!isExpanded())"
        tabindex="0"
      ></div>
    }

    <main class="flex-1 p-6 md:p-10 md:pl-23 transition-[padding] overflow-y-scroll">
      <rs-navigation-tree></rs-navigation-tree>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
