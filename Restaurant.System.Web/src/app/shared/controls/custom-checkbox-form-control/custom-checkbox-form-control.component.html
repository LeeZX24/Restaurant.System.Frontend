<rs-form-control-base [fc]="fc()">
    <div class="form-control" [ngClass]="fc().elementCssClass()">
        <div class="flex items-center gap-2">
            <input
                class="shrink-0"
                [formControl]="fc()" 
                type="checkbox"
                (change)="onInputChange($event)"
                #input
            />
            <span class=" mb-0 cursor-pointer">{{ fc().title }}</span>
        </div>
    </div>
</rs-form-control-base>
