<header class="layout-header">
  <div class="flex items-center gap-1">
    <button
      (click)="toggle.emit()"
      class="flex w-10 items-center justify-center rounded-md hover:bg-slate-100 dark:hover:bg-gray-700/50"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <h1 class="text-lg font-bold tracking-right select-none">R<span class="text-blue-600">S</span></h1>

  <div class="flex items-center gap-2.5">
    <div class="relative hidden items-center md:flex">
      <mat-icon class="absolute left-2.5 pointer-events-none text-base">search</mat-icon>
      <div class="w-2/3">
        <input #searchInput class="w-40 rounded-full border py-1.5 pr-4 pl-10 text-sm tline-hidden transition-all" type="search" [placeholder]="'Search ...'"/>
      </div>
    </div>

    <button class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-full transition-colors md:hidden">
      <mat-icon>search</mat-icon>
    </button>

    <div class="flex items-center scale-90 origin-right"
    [class.hidden]="this.routerService.isSettingsRoute(this.routerService.currentUrl())">
      <rs-toggle [toggle]="darkMode()" [isCheck]="themeService.isDarkMode()" (toggleChecked)="themeService.toggle()"></rs-toggle>
    </div>

    <button class="dark:text-white flex h-9 w-9 items-center justify-center rounded-full"><mat-icon>notifications</mat-icon></button>

    @if (currentUser$ | async; as user) {
      <div class="group border-none items-center justify-center relative">
        <!-- Avatar -->
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white transition-colors hover:bg-blue-700"
        >
          <mat-icon>person</mat-icon>
        </button>

        <!-- Profile popup -->
        <div
          class="invisible absolute right-0 top-full z-50 w-64 translate-y-1 rounded-lg border border-gray-200 bg-white p-4 opacity-0 shadow-lg transition-all duration-150 group-hover:visible group-hover:translate-y-0 group-hover:opacity-100 dark:border-gray-700 dark:bg-gray-800"
        >
          <!-- User -->
          <div class="flex items-center gap-3">
            <div
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white"
            >
              <mat-icon>person</mat-icon>
            </div>

            <div class="min-w-0">
              <p class="truncate font-semibold text-gray-900 dark:text-white">
                {{ user.customerId }}
              </p>

              <p class="truncate text-sm text-gray-500 dark:text-gray-400">
                {{ user.accountInfo?.emailAddress }}
              </p>
            </div>
          </div>

          <!-- User information -->
          <div class="my-3 border-t border-gray-100 dark:border-gray-700"></div>

          <div class="space-y-1 text-sm">
            <p class="text-gray-600 dark:text-gray-300">
              <span class="font-medium text-gray-900 dark:text-white">Role:</span>
              Administrator
            </p>

            <p class="text-gray-600 dark:text-gray-300">
              <span class="font-medium text-gray-900 dark:text-white">Department:</span>
              IT
            </p>
          </div>

          <!-- Actions -->
          <div class="mt-3 border-t border-gray-100 pt-3 dark:border-gray-700">
            <button
              type="button"
              class="w-full rounded-md px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-700"
              (click)="toProfile()"
            >
              View Profile
            </button>

            <button
              type="button"
              class="w-full rounded-md px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-700"
              (click)="signOut()"
            >
              Sign Out
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</header>
