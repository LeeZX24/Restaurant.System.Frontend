<header class="layout-header">
  <div class="flex items-center gap-1">
    <button
      (click)="toggle.emit()"
      class="flex w-10 items-center justify-center rounded-md hover:bg-slate-100 dark:hover:bg-gray-700/50"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <h1 class="text-lg font-bold tracking-right select-none">Vision<span class="text-blue-600">Dash</span></h1>

  <div class="flex items-center gap-2.5">
    <div class="relative hidden items-center md:flex">
      <mat-icon class="absolute left-2.5 pointer-events-none text-base">search</mat-icon>
      <div class="w-2/3">
        <input #searchInput class="w-40 rounded-full border py-1.5 pr-4 pl-10 text-sm tline-hidden transition-all" type="search" [placeholder]="'Search ...'"/>
      </div>
    </div>

    <button class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-full transition-colors md:hidden">
      <mat-icon>search</mat-icon>
    </button>

    <div class="flex items-center scale-90 origin-right"
    [class.hidden]="this.routerService.isSettingsRoute(this.routerService.currentUrl())">
      <rs-toggle [toggle]="darkMode()" [isCheck]="themeService.isDarkMode()" (toggleChecked)="themeService.toggle()"></rs-toggle>
    </div>

    <button class="dark:text-white flex h-9 w-9 items-center justify-center rounded-full"><mat-icon>notifications</mat-icon></button>

    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white">
        JD
    </div>
  </div>
</header>
