<div class="grid grid-cols-5 items-center justify-center h-12 w-full min-w-0 transition-all duration-300 group-hover:text-white">
  <div class="w-16 shrink-0 flex items-center justify-center text-center">
    <mat-icon>{{ item()?.icon }}</mat-icon>
  </div>

  @if (isExpanded()) {
    <span
      class="ml-2 font-medium truncate uppercase text-xs tracking-wider flex-1 font-[inherit] text-left transition-all ease-out"
    [class.col-span-3]="isExpanded()">
      {{ item()?.label }}
    </span>

    @if(hasChildren()) {
      <div class="flex items-center justify-center">
        <mat-icon class="transition-all duration-300"
          [class.rotate-180]="isGroupExpanded()"
          [hidden]="!isExpanded()">
            keyboard_arrow_down
        </mat-icon>
      </div>
    }
  }
</div>
