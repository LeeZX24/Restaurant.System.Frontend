<div 
  class="relative min-w-0"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">
  <button class="nav-item-link"
    type="button"
    [class.font-bold]="isActive()"
    [class.hovered]="isHovered()"
    [class.active]="isActive()"
    [class.active-ancestor]="hasActiveDescendant()"
    [attr.aria-expanded]="hasChildren() ? isGroupExpanded() : null"
    [attr.aria-current]="isActive() ? 'page' : null"
    (click)="handleNavigate()">
    <div class="relative z-10 flex items-center">
      <rs-nav-item [item]="item()!" [isExpanded]="isExpanded()" [isGroupExpanded]="isGroupExpanded()"></rs-nav-item>
    </div>
  </button>

  @if(!isExpanded() && depth() === 0 && isHovered()) {
    <div
      class="fixed left-18 top-auto pb-12 z-50 ml-2 -translate-y-1/2 pointer-events-none animate-in fade-in slide-in-from-left-1 duration-150"
      [class]="!isExpanded() && isHovered()
          ? 'group-hover:visible group-hover:opacity-100 group-hover:translate-x-0 -translate-x-2'
          : 'invisible opacity-0'">
      <div class="relative whitespace-nowrap rounded bg-zinc-900 px-3 py-1.5 text-xs font-medium text-white shadow-2xl ring-1 ring-white/10">
        {{ item()?.label }}

        <!-- Tooltip Arrow (pointing left) -->
        <div
          class="absolute right-full top-1/2 -mr-1 h-2 w-2 -translate-y-1/2 rotate-45 bg-zinc-900 ring-b ring-l ring-white/10"
        ></div>
      </div>
    </div>
  }

  @if(hasChildren() && isExpanded()) {
    <div
      class="grid transition-[grid-template-rows, opacity] duration-300 ease-in-out"
      [class.grid-rows-[0fr]]="!isGroupExpanded()"
      [class.grid-rows-[1fr]]="isGroupExpanded()"
      [class.opacity-0]="!isGroupExpanded()"
      [class.opacity-100]="isGroupExpanded()"
      [class.invisible]="!isGroupExpanded()"
      [attr.aria-hidden]="!isGroupExpanded()"
    >
      <div class="min-h-0 overflow-hidden">
        <div class="ml-4 border-l border-zinc-800 pl-3">
          @for (child of item()?.children; track child.route || child.label; let i = $index) {
            <div
              class="transition-opacity duration-200 ease-out"
              [class.mt-1]="depth() > 0"
              [style.transition-delay.ms]="navService.isExpanded(getKey(item()!)) ? i * 30 : 0"
            >
              <rs-nav-item-control
                [item]="child"
                [isExpanded]="isExpanded()"
                [depth]="depth() + 1"
                (navigationClicked)="navigationClicked.emit()"
              ></rs-nav-item-control>
            </div>
          }
        </div>
      </div>
      
    </div>
  }
</div>
