<!-- Sidebar Navigation -->
<aside
  [class.w-64]="isExpanded()"
  [class.w-16]="!isExpanded()"
  [class.max-md:translate-x-0]="isExpanded()"
  [class.max-md:translate-x-full]="!isExpanded()"
  class="navigation"
>
  <nav class="nav-menu">
    @for (item of navItems; track item.route || item.label) {
      <rs-nav-item-control
        [item]="item"
        [isExpanded]="isExpanded()"
        (navigationClicked)="onNavigationClicked()">
      </rs-nav-item-control>
    }
  </nav>
</aside>
