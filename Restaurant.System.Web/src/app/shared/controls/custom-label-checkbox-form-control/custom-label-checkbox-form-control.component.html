<rs-label-form-control-base [fc]="fc()" [labelSize]="labelSize()" [inputSize]="inputSize()">
    <div class="form-control-check" >
        <div class="flex items-center gap-2">
            <input
                class="shrink-0"
                [formControl]="fc()"
                [class]="fc().elementCssClass()"
                type="checkbox"
                (change)="onInputChange($event)"
                #input
            />
            <span class=" mb-0 cursor-pointer">{{ fc().title }}</span>
        </div>
    </div>
</rs-label-form-control-base>
