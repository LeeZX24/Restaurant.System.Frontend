<h2 class="text-2xl font-bold mb-6 text-center">Staff Login</h2>

<div class="space-y-4">
  <form class="flex w-full items-center border-b border-teal-50" [formGroup]="form">
    <div class="flex flex-col w-full mb-1 gap-1">
      <rs-text-form-control [fc]="usernameFC"></rs-text-form-control>
      <rs-password-form-control [fc]="passwordFC"></rs-password-form-control>

      <!--  -->

      <button
        class="btn-login"
        [class.disabled]="form.invalid"
        (click)="form.invalid ? null : onSubmitLogin()"
        role="button">
        <span class="btn-label">
          <span>Login</span>
        </span>
      </button>
    </div>
  </form>

  <div class="flex m-1 text-sm"> Forgot Password? Please contact Administrator.</div>
</div>
