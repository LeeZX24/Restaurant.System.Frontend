<h2 class="text-2xl font-bold mb-6 text-center">Staff Login</h2>

<div class="space-y-4">
  <form class="flex items-center border-b border-teal-50" [formGroup]="form">
    <div class="flex flex-wrap">
      <div class="w-full mb-1">
        <div class="mt-1">
          <rs-text-form-control [fc]="usernameFC" tabindex="0"></rs-text-form-control>
        </div>
        <div class="mt-1">
          <rs-password-form-control [fc]="passwordFC" tabindex="1"></rs-password-form-control>
        </div>
      </div>

      <div class="flex m-1 text-sm"> Forgot Password? Please contact Administrator.</div>

      <div
        class="w-full btn-login"
        [class.disabled]="form.invalid"
        (click)="form.invalid ? null : onSubmitLogin()"
        (keyup.enter)="onSubmitLogin()"
        role="button"
        tabindex="2"
      >
        <div class="btn-label">
          <span>Login</span>
        </div>
      </div>

      
    </div>
  </form>
</div>
