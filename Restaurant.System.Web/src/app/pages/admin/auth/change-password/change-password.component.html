
<h2 class="text-2xl font-bold mb-6 text-center">Change Password</h2>

<div class="space-y-4">
  <form class="flex items-center border-b border-teal-50" [formGroup]="form">
    <div class="flex flex-wrap">
      <div class="w-full mb-1">
        <rs-label-password-form-control [fc]="passwordFC" tabindex="0"></rs-label-password-form-control>
        <rs-label-password-form-control [fc]="confirmPasswordFC" tabindex="1"></rs-label-password-form-control>
      </div>

      <div
        class="w-full btn-login"
        [class.disabled]="form.invalid"
        (click)="form.invalid ? null : onSubmitChangePassword()"
        (keyup.enter)="onSubmitChangePassword()"
        role="button"
        tabindex="2"
      >
        <div class="btn-label">
          <span>Change Password</span>
        </div>
      </div>
    </div>
  </form>
</div>
