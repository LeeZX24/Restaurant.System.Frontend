
<div class="w-max-md lg:w-max-4xl">
  <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>

  <form class="space-y-8 p-4 sm:p-6" [formGroup]="form">
    <div class="gap-1">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="flex flex-col w-full gap-1">
          <rs-label-email-form-control [fc]="emailFC"></rs-label-email-form-control>
          <rs-label-password-form-control [fc]="passwordFC"></rs-label-password-form-control>
          <rs-label-password-form-control [fc]="confirmPasswordFC"></rs-label-password-form-control>
        </div>

        <div class="flex flex-col w-full gap-1">
          <rs-label-text-form-control [fc]="lastNameFC"></rs-label-text-form-control>
          <rs-label-text-form-control [fc]="firstNameFC"></rs-label-text-form-control>
          <rs-label-text-form-control [fc]="middleNameFC"></rs-label-text-form-control>
        </div>
      </div>

      <div class="flex flex-col-reverse">
        <button
          class="button btn-register"
          [class.disabled]="form.invalid"
          (click)="form.invalid ? null : onSubmitRegister()"
          (keyup.enter)="onSubmitRegister()"
          role="button">
          <span class="btn-label">
            <span>Register</span>
          </span>
        </button>
      </div>
      
    </div>
  </form>

  <div class="flex flex-col space-y-4 h-full">
    <p class="text-center text-sm mt-4">
      Already registered?
      <!-- <a href="/register" class="text-blue-600 underline">Register</a> -->
      <button class="link" (click)="redirectLogin()">Login</button>
    </p>
  </div>
</div>
