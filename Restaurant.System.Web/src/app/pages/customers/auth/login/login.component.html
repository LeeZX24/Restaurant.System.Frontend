<div class="w-max-md">
  <h2 class="text-2xl font-bold mb-6 text-center">Member Login</h2>

  <div class="space-y-4">
    <form class="flex items-center border-b border-teal-50" [formGroup]="form">
      <div class="flex flex-col w-full gap-1">
        <rs-email-form-control [fc]="emailFC"></rs-email-form-control>
        <rs-password-form-control [fc]="passwordFC"></rs-password-form-control>

        <button
          class="btn-login"
          [class.disabled]="form.invalid"
          (click)="form.invalid ? null : onSubmitLogin()"
          (keyup.enter)="onSubmitLogin()"
          role="button"
        >
          <div class="btn-label">
            <span>Login</span>
          </div>
        </button>
      </div>
    </form>
  </div>

  <div class="flex flex-col space-y-4 h-full">
    <p class="text-center text-sm mt-4">
      No account?
      <button
        class="link"
        (click)="redirectRegister()"
        (keydown.enter)="redirectRegister()"
        (keydown.space)="redirectRegister()"
        role="link">
        Register
      </button>
    </p>
  </div>
</div>
